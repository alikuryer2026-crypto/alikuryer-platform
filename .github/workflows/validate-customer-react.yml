name: Validate React Customer App
on:
  push:
    branches: [main]
    paths:
      - 'customer-react/**'
      - '.github/workflows/validate-customer-react.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
